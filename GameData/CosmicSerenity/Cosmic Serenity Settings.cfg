// This file dictates some aspects of this mod, do not change unless you know what you are doing

CosmicSerenitySettings
{
    //************************Cosmic Serenity Settings************************

        //*************Rescale*************
        
            Rescale = 1

                // Choices
                    // 1 - Normal Scale
                    // 2.5
                    // 10
        
        //*************Other Settings*************

            KerbalizedNames = False
            // Dictates whether or not you want the names to be kerbalized or not
                // False - Default, uses the default names
                // True - Will change names to versions you'd see more in KSP


            DisableSkybox = False
            // Dictates whether or not you want to disable the CS skybox or not
                // False - Default, use the CS Skybox
                // True - Uses the default skybox

            VolumetricRings = True 
            // Dictates whether or not you want to disable volumetric rings, useful for less powerful PCs as it tends to cause lag, currently will not work properly with rescale
                // True - Default, have volumetric rings
                // False - Turn off volumetric rings for better performance
                

                
            //***************Wormhole Settings***************

                Wormholes = True // REQUIRES Singularity and KopernicusExpansion to function - Not Compatible with Sol
                // Dictates whether or not you want wormholes to link the different systems together
                    // True  - Will add a serie of wormholes to link the different systems
                    // False - Default, no wormholes

        //***************Homeswitch Settings***************

            HomeSwitch = False // If you have distant object enhancement, make sure to uninstall it as it will cause an interesting issue that ruins the sky
            // Will dictate where you start - Not compatible with KSC Switcher ofc
                // False - Will start on Kerbin or wherever depending on other homeswitches
                // Iris - Will start on Iris, around Hades
                // Sobek - Will start on Sobek (more challenging), around Anubis
                // Hundun - Will start on Hundun, prehistoric planet around young orange dwarf
                // Shan - Will start on Shan, Icy planet with equatorial ocean
                // Yang - Will start on Yang, volcanic moon around the ice giant Qi
                // Poseidon - Will start on Poseidon, dead world in the Atlas system

        //************************Systems Settings************************

            //***************Hades System Settings***************

                AtmosLoadAtOnce = False
                // Will dictate whether or not all of the atmospheres in the Hades system are loaded all at once and at all time, which can reduce potential freezes but may crash PCs with lower RAM
                    // True     - Default
                    // False    - Atmos will load with proximity

        
            //************************Celestial Harmony Compatibility************************

                //Relocate Wormhole
                ChaosWormhole = False // This will move the wormhole from around Aklarka to another place in the Chaos System
                    // True     - Wormhole in Chaos System
                    // False    - Wormhole stays around Aklarka
}
