//Based heavily on the experiment and definitions done by JadeOfMaar in Rational Resources.
EXPERIMENT_DEFINITION
{
	id = CSgravyPing
	title = CS Graviolium Ping
	baseValue = 1
	scienceCap = 1
	dataScale = 1
	
	requireAtmosphere = False
	situationMask = 48
	//situationMask = 63
	biomeMask = 1
	
	RESULTS
	{
		default = Ping...... Bonk.. No Graviolium on this planet. No graviolium for you.  Move along! (Maybe GoldStrike lodes?)
	}
}

// Install into any part that is a Graviolium scanner.  This includes the surface scanner and the M4435 narrowband scanner, but not the M700 orbital resource scanner.
// Naturally Blueshift and/or KFS is needed to get the sweet delicious graviolium.
@PART:HAS[@MODULE[ModuleResourceScanner]:HAS[#ResourceName[Graviolium]]]:NEEDS[!RationalResources]:FOR[zCosmicSerenity]
{
	@description ^= :$: <br><#4FBBFF>Graviolium scanner.</color>
	MODULE
	{
		name = ModuleScienceExperiment
		experimentID = CSgravyPing
		experimentActionName = Ping Graviolium
		resetActionName = Discard Data
		reviewActionName = Review Data
		useStaging = False
		useActionGroups = True
		hideUIwhenUnavailable = False
		xmitDataScalar = 1
		dataIsCollectable = True
		collectActionName = Download Data
		interactionRange = 1.5
		rerunnable = True
		usageReqMaskInternal = 1
		usageReqMaskExternal = 8
	}
}


