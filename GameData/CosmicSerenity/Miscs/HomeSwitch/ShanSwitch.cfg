// Change Homeworld for the new one

@Kopernicus_config:HAS[@CosmicSerenitySettings:HAS[#HomeSwitch[Shan]]]:AFTER[Kopernicus]
{
    @HomeWorldName = Shan
}
// Kill Kerbin KSC cuz grrr causes issues
@Kopernicus:HAS[@CosmicSerenitySettings:HAS[#HomeSwitch[Shan]]]:AFTER[Kopernicus]
{
    @Body[Kerbin]
    {
        !SpaceCenter {}

        @PQS
        {
            !Mods[MapDecalTangent,KSC] {}
        }
    }
}

// KSC Parameters
@Kopernicus:HAS[@CosmicSerenitySettings:HAS[#HomeSwitch[Shan]]]:AFTER[CosmicSerenity]
{
    @Body[Shan]
    {
        @PQS
        {
            @Mods
            {
                %MapDecalTangent
                {
                    %absolute = true
                    %absoluteOffset = 12
                    %angle = 0
                    %cullBlack = False
                    %DEBUG_HighlightInclusion = False
                    %heightMap = BUILTIN/ksc_decal_heightMap
                    %heightMapDeformity = 71
                    %Position
                    {
                        %latitude = 23.0857633052616
                        %longitude = 155.982730387971
                    }
                    %removeScatter = false
                    %radius = 9200
                    %useAlphaHeightSmoothing = True
                    %enabled = True
                    %name = KSC
                }

                // Remove scatters using Parallax Decal
                !MapDecalVertexRemoveScatter:HAS[#name[ParallaxMaskKSC]] {} // Remove original one

                MapDecalVertexRemoveScatter:NEEDS[ParallaxContinued]
				{
                    name = ParallaxMaskKSC
					BlockedScatters // Change these values for the scatters of your choice
					{
						name = TinyRocks
						name = SmallRocks
						name = MedRocks
						name = LargeRocks
                        name = HugeRocks
                        name = HugeRocks2
                        name = HugeRocks41
					}
					Position
					{
						// Exact center of the top of the KSC VAB between the two helipads
						latitude = 23.0857633052616
						longitude = 155.982730387971
					}
					angle = 0
                    colorMap = Parallax_StockScatterTextures/Textures/Kerbin/PluginData/kscMask.dds
                    order = 99999
                    radius = 10900
				}
            }
            
        }
        // Space Center settings
        %SpaceCenter
        {
            latitude = 23.0857633052616
            longitude = 155.982730387971
            decalLatitude = 23.0857633052616
            decalLongitude = 155.982730387971
            reorientFinalAngle = 114.017269612029
            repositionRadiusOffset = 57
            radius = 12000
            groundColor = 1,1,1
            editorGroundColor = 1,1,1
        }

        
    }
}