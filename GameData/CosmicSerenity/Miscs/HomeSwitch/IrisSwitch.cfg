// Change Homeworld for the new one

@Kopernicus_config:HAS[@CosmicSerenitySettings:HAS[#HomeSwitch[Iris]]]:AFTER[Kopernicus]
{
    @HomeWorldName = Iris
}
// Kill Kerbin KSC cuz grrr causes issues
@Kopernicus:HAS[@CosmicSerenitySettings:HAS[#HomeSwitch[Iris]]]:AFTER[Kopernicus]
{
    @Body[Kerbin]
    {
        !SpaceCenter {}

        @PQS
        {
            !Mods[MapDecalTangent,KSC] {}
        }
    }
}

// KSC Parameters
@Kopernicus:HAS[@CosmicSerenitySettings:HAS[#HomeSwitch[Iris]]]:AFTER[CosmicSerenity]
{
    @Body[Iris]
    {
        @PQS
        {
            @Mods
            {
                %MapDecalTangent
                {
                    %absolute = true
                    %absoluteOffset = 12
                    %angle = 0
                    %cullBlack = False
                    %DEBUG_HighlightInclusion = False
                    %heightMap = BUILTIN/ksc_decal_heightMap
                    %heightMapDeformity = 55
                    %Position
                    {
                        %latitude = -1.64964722350999
                        %longitude = -159.705919170078
                    }
                    %removeScatter = false
                    %radius = 9200
                    %useAlphaHeightSmoothing = True
                    %enabled = True
                    %name = KSC
                }

                // Remove scatters using Parallax Decal
                !MapDecalVertexRemoveScatter:HAS[#name[ParallaxMaskKSC]] {} // Remove original one

                MapDecalVertexRemoveScatter:NEEDS[ParallaxContinued]
				{
                    name = ParallaxMaskKSC
					BlockedScatters // Change these values for the scatters of your choice
					{
						name = Fulmen
						name = Tentorium
						name = Cacumino
						name = IrisFein2
					}
					Position
					{
						// Exact center of the top of the KSC VAB between the two helipads
						latitude = -1.64964722350999
						longitude = -159.705919170078
					}
					angle = 0
                    colorMap = Parallax_StockScatterTextures/Textures/Kerbin/PluginData/kscMask.dds
                    order = 99999
                    radius = 4900
				}
            }
            
        }
        // Space Center settings
        %SpaceCenter
        {
            latitude = -1.64964722350999
            longitude = -159.705919170078
            decalLatitude = -1.64964722350999
            decalLongitude = -159.705919170078
            reorientFinalAngle = 66
            repositionRadiusOffset = 44
            radius = 10000
            groundColor = 0.812, 0.541, 0.459
            editorGroundColor = 0.812, 0.541, 0.459
        }

        
    }
}