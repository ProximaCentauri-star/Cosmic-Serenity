// Change Homeworld for the new one

@Kopernicus_config:HAS[@CosmicSerenitySettings:HAS[#HomeSwitch[Poseidon]]]:AFTER[Kopernicus]
{
    @HomeWorldName = Poseidon
}
// Kill Kerbin KSC cuz grrr causes issues
@Kopernicus:HAS[@CosmicSerenitySettings:HAS[#HomeSwitch[Poseidon]]]:AFTER[Kopernicus]
{
    @Body[Kerbin]
    {
        !SpaceCenter {}

        @PQS
        {
            !Mods[MapDecalTangent,KSC] {}
        }
    }
}

// KSC Parameters
@Kopernicus:HAS[@CosmicSerenitySettings:HAS[#HomeSwitch[Poseidon]]]:AFTER[CosmicSerenity]
{
    @Body[Poseidon]
    {
        @PQS
        {
            @Mods
            {
                %MapDecalTangent
                {
                    %absolute = true
                    %absoluteOffset = 12
                    %angle = 0
                    %cullBlack = False
                    %DEBUG_HighlightInclusion = False
                    %heightMap = BUILTIN/ksc_decal_heightMap
                    %heightMapDeformity = 55
                    %Position
                    {
                        %latitude = 0.556515182609939
                        %longitude = -49.5936510467824
                    }
                    %removeScatter = false
                    %radius = 9200
                    %useAlphaHeightSmoothing = True
                    %enabled = True
                    %name = KSC
                }

                // Remove scatters using Parallax Decal
                !MapDecalVertexRemoveScatter:HAS[#name[ParallaxMaskKSC]] {} // Remove original one

                MapDecalVertexRemoveScatter:NEEDS[ParallaxContinued]
				{
                    name = ParallaxMaskKSC
					BlockedScatters // Change these values for the scatters of your choice
					{
						name = MedRocks
						name = LargeRocks
						name = HugeRocks
						name = HugeRocks2
                        name = HugeRocks41
                        name = SlabsSmall
                        name = SlabsMed
                        name = SlabsLarge
                        name = MetalSpireWide
                        name = MetalSpire
                        name = HugeMetalCluster
                        name = LargeMetalCluster
                        name = SmallMetalCluster
					}
					Position
					{
						// Exact center of the top of the KSC VAB between the two helipads
						latitude = 0.556515182609939
						longitude = -49.5936510467824
					}
					angle = 180
                    colorMap = Parallax_StockScatterTextures/Textures/Kerbin/PluginData/kscMask.dds
                    order = 99999
                    radius = 16000
				}
            }
            
        }
        // Space Center settings
        %SpaceCenter
        {
            latitude = 0.556515182609939
            longitude = -49.5936510467824
            decalLatitude = 0.556515182609939
            decalLongitude = -49.5936510467824
            reorientFinalAngle = 111.1958
            repositionRadiusOffset = 40
            radius = 10000
            groundColor = 0.742307663,0.546153963,0.292307824,1
            editorGroundColor = 0.742307663,0.546153963,0.292307824,1
            heightMapDeformity = 40
            absoluteOffset = 24
        }

        
    }
}