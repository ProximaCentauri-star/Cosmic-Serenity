// Change Homeworld for the new one

@Kopernicus_config:HAS[@CosmicSerenitySettings:HAS[#HomeSwitch[Sobek]]]:AFTER[Kopernicus]
{
    @HomeWorldName = Sobek
}
// Kill Kerbin KSC cuz grrr causes issues
@Kopernicus:HAS[@CosmicSerenitySettings:HAS[#HomeSwitch[Sobek]]]:AFTER[Kopernicus]
{
    @Body[Kerbin]
    {
        !SpaceCenter {}

        @PQS
        {
            !Mods[MapDecalTangent,KSC] {}
        }
    }
}

// KSC Parameters
@Kopernicus:HAS[@CosmicSerenitySettings:HAS[#HomeSwitch[Sobek]]]:AFTER[CosmicSerenity]
{
    @Body[Sobek]
    {
        @PQS
        {
            @Mods
            {
                %MapDecalTangent
                {
                    %absolute = true
                    %absoluteOffset = 12
                    %angle = 0
                    %cullBlack = False
                    %DEBUG_HighlightInclusion = False
                    %heightMap = BUILTIN/ksc_decal_heightMap
                    %heightMapDeformity = 55
                    %Position
                    {
                        %latitude = 41.015399941854
                        %longitude = 141.863751726857
                    }
                    %removeScatter = false
                    %radius = 9200
                    %useAlphaHeightSmoothing = True
                    %enabled = True
                    %name = KSC
                }

                // Remove scatters using Parallax Decal
                !MapDecalVertexRemoveScatter:HAS[#name[ParallaxMaskKSC]] {} // Remove original one

                MapDecalVertexRemoveScatter:NEEDS[ParallaxContinued]
				{
                    name = ParallaxMaskKSC
					BlockedScatters // Change these values for the scatters of your choice
					{
						name = TinyRocks
						name = SmallRocks
						name = MedRocks
						name = LargeRocks
                        name = HugeRocks
                        name = HugeRocks2
                        name = HugeRocks41
					}
					Position
					{
						// Exact center of the top of the KSC VAB between the two helipads
						latitude = 41.015399941854
                        longitude = 141.863751726857
					}
					angle = 0
                    colorMap = Parallax_StockScatterTextures/Textures/Kerbin/PluginData/kscMask.dds
                    order = 99999
                    radius = 4900
				}
            }
            
        }
        // Space Center settings
        %SpaceCenter
        {
            latitude = 41.015399941854
            longitude = 141.863751726857
            decalLatitude = 41.015399941854
            decalLongitude = 141.863751726857
            reorientFinalAngle = 225
            repositionRadiusOffset = 44
            radius = 5000
            groundColor = 0.812, 0.541, 0.459
            editorGroundColor = 0.812, 0.541, 0.459
            heightMapDeformity = 10
            absoluteOffset = 55
        }

        
    }
}