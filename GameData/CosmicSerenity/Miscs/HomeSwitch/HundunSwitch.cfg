// Change Homeworld for the new one

@Kopernicus_config:HAS[@CosmicSerenitySettings:HAS[#HomeSwitch[Hundun]]]:AFTER[Kopernicus]
{
    @HomeWorldName = Hundun
}
// Kill Kerbin KSC cuz grrr causes issues
@Kopernicus:HAS[@CosmicSerenitySettings:HAS[#HomeSwitch[Hundun]]]:AFTER[Kopernicus]
{
    @Body[Kerbin]
    {
        !SpaceCenter {}

        @PQS
        {
            !Mods[MapDecalTangent,KSC] {}
        }
    }
}

// KSC Parameters
@Kopernicus:HAS[@CosmicSerenitySettings:HAS[#HomeSwitch[Hundun]]]:AFTER[CosmicSerenity]
{
    @Body[Hundun]
    {
        @PQS
        {
            @Mods
            {
                %MapDecalTangent
                {
                    %absolute = true
                    %absoluteOffset = 12
                    %angle = 0
                    %cullBlack = False
                    %DEBUG_HighlightInclusion = False
                    %heightMap = BUILTIN/ksc_decal_heightMap
                    %heightMapDeformity = 55
                    %Position
                    {
                        %latitude = 2.2002242871436
                        %longitude = 158.804212442089
                    }
                    %removeScatter = false
                    %radius = 9200
                    %useAlphaHeightSmoothing = True
                    %enabled = True
                    %name = KSC
                }

                // Remove scatters using Parallax Decal
                !MapDecalVertexRemoveScatter:HAS[#name[ParallaxMaskKSC]] {} // Remove original one

                MapDecalVertexRemoveScatter:NEEDS[ParallaxContinued]
				{
                    name = ParallaxMaskKSC
					BlockedScatters // Change these values for the scatters of your choice
					{
						name = BambooRod
						name = TowerTree
						name = LargeRocks
						name = HugeRocks
					}
					Position
					{
						// Exact center of the top of the KSC VAB between the two helipads
						latitude = 2.2002242871436
						longitude = 158.894212442089
					}
					angle = 180
                    colorMap = Parallax_StockScatterTextures/Textures/Kerbin/PluginData/kscMask.dds
                    order = 99999
                    radius = 6000
				}
            }
            
        }
        // Space Center settings
        %SpaceCenter
        {
            latitude = 2.2002242871436
            longitude = 158.894212442089
            decalLatitude = 2.2002242871436
            decalLongitude = 158.804212442089
            reorientFinalAngle = 111.1958
            repositionRadiusOffset = 40
            radius = 7000
            groundColor = 0.296615601,0.529461563,0.220538452,1
            editorGroundColor = 0.296615601,0.529461563,0.220538452,1
            heightMapDeformity = 55
            absoluteOffset = 10
        }

        
    }
}