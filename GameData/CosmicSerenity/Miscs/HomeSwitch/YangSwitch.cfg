{
    @Body[Yang]
    {
        @PQS
        {
            @Mods
            {
                %MapDecalTangent
                {
                    %absolute = true
                    %absoluteOffset = 12
                    %angle = 0
                    %cullBlack = False
                    %DEBUG_HighlightInclusion = False
                    %heightMap = BUILTIN/ksc_decal_heightMap
                    %heightMapDeformity = 55
                    %Position
                    {
                        %latitude = -3.59010243623171
                        %longitude = -16.4821819587316
                    }
                    %removeScatter = false
                    %radius = 9200
                    %useAlphaHeightSmoothing = True
                    %enabled = True
                    %name = KSC
                }

