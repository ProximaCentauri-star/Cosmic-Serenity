// Change Homeworld for the new one

@Kopernicus_config:HAS[@CosmicSerenitySettings:HAS[#HomeSwitch[Yang]]]:AFTER[Kopernicus]
{
    @HomeWorldName = Yang
}
// Kill Kerbin KSC cuz grrr causes issues
@Kopernicus:HAS[@CosmicSerenitySettings:HAS[#HomeSwitch[Yang]]]:AFTER[Kopernicus]
{
    @Body[Kerbin]
    {
        !SpaceCenter {}

        @PQS
        {
            !Mods[MapDecalTangent,KSC] {}
        }
    }
}

// KSC Parameters
