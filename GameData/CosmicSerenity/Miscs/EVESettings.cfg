// This part here removes volumetric rings

// Hundun
@EVE_CLOUDS:HAS[@CosmicSerenitySettings:HAS[#VolumetricRings[?alse]]]:AFTER[CosmicSerenity]
{
    -OBJECT[HundunRings-Inner]{}
}
@EVE_CLOUDS:HAS[@CosmicSerenitySettings:HAS[#VolumetricRings[?alse]]]:AFTER[CosmicSerenity]
{
    -OBJECT[HundunRings-Outer]{}
}

