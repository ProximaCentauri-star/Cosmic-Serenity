@ParallaxTerrain:NEEDS[ParallaxContinued]:FINAL
{

    @Body[Shan]
    {
        // Here is where the usual terrain config goes
        // This patches in the scaled properties
        ParallaxScaledProperties
        {
            // Possible modes:
            // FromTerrain
            // Baked
            // Custom
            // CustomRequiresTerrain

            // Altitude in meters
            minTerrainAltitude = -1388.07
            maxTerrainAltitude = 6744.10

            // We need to use the real mesh for scatterer compatibility
            usingStockMesh:NEEDS[Scatterer] = True

            // Shader modes
            mode = FromTerrain
            Material
            {
                _ColorMap = CosmicSerenity/_Systems/Yunxiao/Textures/PluginData/ShanColor.dds
                _BumpMap = CosmicSerenity/_Systems/Yunxiao/Textures/PluginData/ShanNrm.dds
                _HeightMap = CosmicSerenity/_Systems/Yunxiao/Textures/PluginData/ShanHeight.dds
                _PlanetBumpScale = 1

                // Keyword params
                _OceanSpecularPower = 0.5
                _OceanSpecularIntensity = 0.35
                _AtmosphereThickness = 1
                _OceanAltitude = 0.1

                Keywords
                {
                    name = OCEAN_FROM_COLORMAP
                    name:NEEDS[!Scatterer] = ATMOSPHERE
                }
            }
            TerrainMaterialOverride
            {
                _Tiling = 0.0009
                _EnvironmentMapFactor = 0.
                _MidHighBlendStart = 2000
                _MidHighBlendEnd = 3000
            }
        }
    }
