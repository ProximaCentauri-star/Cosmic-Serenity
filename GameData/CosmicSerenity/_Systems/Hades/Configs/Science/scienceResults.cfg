//Planet Classification Experiment
@EXPERIMENT_DEFINITION:HAS[#id[CSplanetClass]]:NEEDS[!RationalResourcesAU]
{
	@RESULTS
	{
		HadesInSpaceHigh = #$@CS_SCIDICT/CS_Class_StarPop1High$
		HadesInSpaceLow = #$@CS_SCIDICT/CS_Class_StarPop1Low$
		
		ChromeInSpaceHigh = #$@CS_SCIDICT/CS_Class_SrfIceNitroCarbonHigh$
		ChromeInSpaceLow = #$@CS_SCIDICT/CS_Class_SrfIceNitroCarbonLow$
		CaelusInSpaceHigh = #$@CS_SCIDICT/CS_Class_AtmGasIIHigh$
		CaelusInSpaceLow = #$@CS_SCIDICT/CS_Class_AtmGasIILow$
		CorneaInSpaceHigh = #$@CS_SCIDICT/CS_Class_SrfRockHigh$
		CorneaInSpaceLow = #$@CS_SCIDICT/CS_Class_SrfRockLow$
		EnmyInSpaceHigh = #$@CS_SCIDICT/CS_Class_SrfRockHigh$
		EnmyInSpaceLow = #$@CS_SCIDICT/CS_Class_SrfRockLow$ $@CS_SCIDICT/CS_Class_AtmDefault$
		FolieInSpaceHigh = #$@CS_SCIDICT/CS_Class_SrfRockHigh$
		FolieInSpaceLow = #$@CS_SCIDICT/CS_Class_SrfRockLow$ $@CS_SCIDICT/CS_Class_AtmDefault$
		IrisInSpaceHigh = #$@CS_SCIDICT/CS_Class_SrfRockMineralHigh$
		IrisInSpaceLow = #$@CS_SCIDICT/CS_Class_SrfRockMineralLow$ $@CS_SCIDICT/CS_Class_AtmTerra$ 
		IrisSrfSplashed = #$@CS_SCIDICT/CS_Class_OcnMudWarm$
		JotunnInSpaceHigh = #$@CS_SCIDICT/CS_Class_SrfIceMethaneHigh$
		JotunnInSpaceLow = #$@CS_SCIDICT/CS_Class_SrfIceMethaneLow$ $@CS_SCIDICT/CS_Class_AtmIceAmmonia$ 
		LyxInSpaceHigh = #$@CS_SCIDICT/CS_Class_SrfRockIceHigh$
		LyxInSpaceLow = #$@CS_SCIDICT/CS_Class_SrfRockIceLow$
		MilenaInSpaceHigh = #$@CS_SCIDICT/CS_Class_SrfRockIceHigh$
		MilenaInSpaceLow = #$@CS_SCIDICT/CS_Class_SrfRockIceLow$
	}
}

@EXPERIMENT_DEFINITION:HAS[#id[CSgravyPing]]:NEEDS[!RationalResources]
{
	@RESULTS
	{
		// Stars
		HadesInSpaceHigh = #$@CS_SCIDICT/CS_gravyPing_StarPop1$
		HadesInSpaceLow = #$@CS_SCIDICT/CS_gravyPing_StarPop1$
		
		//Planets
		CaelusInSpace = #$@CS_SCIDICT/CS_gravyPing_PlanetLight$
		EnmyInSpace = #$@CS_SCIDICT/CS_gravyPing_PlanetLight$
		
	}
}


@EXPERIMENT_DEFINITION:HAS[#id[crewReport]]
{
    @RESULTS
    {
		//BlackHoleNerd
		HadesInSpaceHigh = The star still isn't visible from out here.
		HadesInSpaceLow = You look at the pink-colored object, the tail of Hephae easily visible.
		
		FolieInSpaceHigh = The planet's tail contrasts the much darker body it originates from. You can see global aurorae covering it.
		FolieInSpaceLow = You look at the planet below through the window. You can see some geological formations.
		FolieFlyingHigh = The craft sways in the wind.
		FolieFlyingLow = You start to feel the heat of Hephae's surface.
		FolieSrfLanded = You feel the heat of Hephae's surface through the craft.
		
		MilenaInSpaceHigh = This is just Duna, isn't it?
		MilenaInSpaceLow = This is just Duna without an atmosphere
		MilenaSrfLanded = This place is a tad boring.
		MilenaSrfLandedIce_Depots = This place is a tad nice.
		
		IrisInSpaceHigh = From out your window you can see the eyeball planet. You think it might be staring at you.
		IrisInSpaceLow = It's very similar to kerbin, except the contrast between the day and nightsides.
		IrisFlyingHigh = The upper atmosphere sways your craft.
		IrisFlyingLow = The lower atmosphere sways your craft.
		IrisFlyingLowThe_Void = You think the craft might just actually get ripped apart from the strong winds.
		IrisSrfLandedTerminator = You look out the window at the place you've landed. It's actually pretty nice, all things considered.
		IrisSrfLandedDark_Side = The outside looks incredibly depressing.
		IrisSrfLandedFrozen_Lake = The outside looks incredibly depressing.
		IrisSrfLandedCanyons = The sight of Hades marked by the canyon walls is a sigh to behold through your window.
		IrisSrfLandedPoles = It's very snowy outside.
		IrisSrfSplashedThe_Void = The strong winds threaten to rip you out of the water and fling you into the air.
		IrisSrfSplashedRivers = The vehicle sways in the waves.
		
		CorneaInSpace = You wonder how this thing stays in orbit instead of going out into Hadean orbit.
		CorneaSrfLanded = The craft touches down. You look out at Iris in the sky in awe.
		
		EnmyInSpaceHigh = Now THIS is a proper Duna analogue!
		EnmyInSpaceLow = We're entering the atmos- Wait, not yet?
		EnmyFlyingHigh = The surface is far too close for comfort.
		EnmyFlyingLow = The surface is approaching a tad fast, isn't it?
		EnmySrfLanded = You look out the window at the red world outside.
		
		CaelusInSpaceHigh = You look out at the ice giant. It looks purple, although it isn't.
		CaelusInSpaceLow = The clouds of Caelus look gorgeous from up close
		CaelusFlyingHigh = This is a horrid idea.
		CaelusFlyingLow = The winds might rip the capsule in half and kill you instantly.
		
		LyxInSpaceHigh = It's REALLY tiny.
		LyxInSpaceLow = It seems to be about as big as Gilly.
		LyxSrfLanded = The object's gravity barely holds you down.
		
		JotunnInSpaceHigh = The world below seems to be similar to Eeeloo. You think you can see jets of material emerging from it's surface.
		JotunnInSpaceLow = You can see the world below with detail. It's crisscrossed with canyons. You think you can hear microparticles hitting the hull.
		JotunnFlyingHigh = Wait, what?
		JotunnFlyingLow = Your craft slows down in the thin atmosphere.
		JotunnSrfLanded = The craft slightly sinks into the soft ground.
		
		ChromeInSpaceHigh = The large craters catch your eye.
		ChromeInSpaceLow = From up close it's a lot more boring.
		ChromeSrfLanded = Caelus looks nice in the sky. Except if you're in the dark side, then i don't know what i can do for you.
		
		
		
	}
}