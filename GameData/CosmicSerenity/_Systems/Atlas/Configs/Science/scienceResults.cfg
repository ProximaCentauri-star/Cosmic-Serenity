		AtlasAInSpaceLow = You think you just heard something on your ship blow up.
		AtlasAaInSpaceHigh = The ship begins heating up due to the proximity to both stars.
		AtlasAaInSpaceLow = You feel the heat inside the capsule and begin sweating from fear and the heat.
