		IcarusInSpaceLow = The clouds look gorgeous from up close, twisting and turning below you in the heat of the star.
		IcarusFlyingHigh = The sky begins turning a shade of red as you enter the atmosphere.
		IcarusFlyingLow = Under the cloud deck, the storms are much more apparent.
		
		PlutusInSpaceHigh = Plutus looks menacing below you, with a large ring system and a complete lack of atmosphere.
		PlutusInSpaceLow = You're orbiting this object concerningly quickly, these kinds of speeds are usually what you would get around a gas giant.
		PlutusSrfLanded = You can hear as the landing leg nearly snaps. The entire craft is threatening to fall apart.
		
		ObjectInSpaceHigh = What. Is. That.
		ObjectInSpaceLow = You feel uneasy. You think you hear a hum through the radio.
		ObjectFlyingHigh = You feel unea- Wait we're in an atmosphere?.
		ObjectFlyingLow = You can see strange, root-like structures on the surface. You feel uneasy.
		ObjectSrfLanded = Can we please leave?.
		
		
	}
}

