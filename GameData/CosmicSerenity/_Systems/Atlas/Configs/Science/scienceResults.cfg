		ObjectInSpaceLow = The instruments indicate that you are orbiting closer around the planet. The danger sensitive windows are steadfastly opaque. There is no danger.
		ObjectFlyingHigh = The danger sensitive windows turn an even more opaque shade of opaque. There is obviously no danger to be found here.
		ObjectFlyingLow = You are confident that you are flying low to the planet but the danger sensitive windows have turned an opaque shade of opaque such as to rival a black hole. No danger.
