		ErebusFlyingHigh = Wait, we're already at less than 50 meters per second?.
		ErebusFlyingLow = You nearly fall asleep approaching the surface when a groan of the hull wakes you up.
		ErebusSrfLanded = The craft is groaning violently.
		
