//Planet Classification Experiment
@EXPERIMENT_DEFINITION:HAS[#id[RRplanetClass]]:NEEDS[!RationalResourcesAU]
{
	@RESULTS
	{
		AtlasAInSpaceHigh = #$@RR_SCIDICT/RR_Class_StarPop1High$
		AtlasAInSpaceLow = #$@RR_SCIDICT/RR_Class_StarPop1Low$
		AtlasAaInSpaceHigh = #$@RR_SCIDICT/RR_Class_StarPop1High$
		AtlasAaInSpaceLow = #$@RR_SCIDICT/RR_Class_StarPop1Low$
		AtlasBInSpaceHigh = #$@RR_SCIDICT/RR_Class_StarPop1High$
		AtlasBInSpaceLow = #$@RR_SCIDICT/RR_Class_StarPop1Low$
		
		PoseidonInSpaceHigh = #$@RR_SCIDICT/RR_Class_SrfRockHigh$
		PoseidonInSpaceLow = #$@RR_SCIDICT/RR_Class_SrfRockLow$ $@RR_SCIDICT/RR_Class_OcnAcid$ $@RR_SCIDICT/RR_Class_AtmAcidC$
		ErebusInSpaceHigh = #$@RR_SCIDICT/RR_Class_SrfRockHigh$
		ErebusInSpaceLow = #$@RR_SCIDICT/RR_Class_SrfRockLow$ $@RR_SCIDICT/RR_Class_AtmDefault$ 
		IcarusInSpaceHigh = #$@RR_SCIDICT/RR_Class_AtmGasVHigh$
		IcarusInSpaceLow = #$@RR_SCIDICT/RR_Class_AtmGasVLow$
		PlutusInSpaceHigh = #$@RR_SCIDICT/RR_Class_SrfRockMetalHigh$
		PlutusInSpaceLow = #$@RR_SCIDICT/RR_Class_SrfRockMetalLow$
		ObjectInSpaceHigh = #$@RR_SCIDICT/RR_Class_SrfRockMetalHigh$ $@RR_SCIDICT/RR_Class_AtmPandora$
		ObjectInSpaceLow = #$@RR_SCIDICT/RR_Class_SrfRockMetalLow$ $@RR_SCIDICT/RR_Class_AtmPandora$
	}
}
		
//Graviolium Experiment
@EXPERIMENT_DEFINITION:HAS[#id[RRgravioliPing]]
{
	@RESULTS
	{
		AtlasAInSpaceLow = #$@RR_SCIDICT/RR_GravPing_StarPop1$
		AtlasAaInSpaceLow = #$@RR_SCIDICT/RR_GravPing_StarPop1$
		AtlasBInSpaceLow = #$@RR_SCIDICT/RR_GravPing_StarPop1$
		ObjectInSpace = #$@RR_SCIDICT/RR_GravPing_PlanetHeavy$
	}
}