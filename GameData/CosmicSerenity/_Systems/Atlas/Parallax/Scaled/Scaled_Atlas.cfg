@ParallaxTerrain:NEEDS[ParallaxContinued]:FINAL
{

    @Body[Object]
    {
        // Here is where the usual terrain config goes
        // This patches in the scaled properties
        ParallaxScaledProperties
        {
            // Possible modes:
            // FromTerrain
            // Baked
            // Custom
            // CustomRequiresTerrain

            // Altitude in meters
            minTerrainAltitude = -394
            maxTerrainAltitude = 7985
            mode = FromTerrain
            Material
            {
                _ColorMap = CosmicSerenity/_Systems/Atlas/Textures/PluginData/ObjectClr.dds
                _BumpMap = CosmicSerenity/_Systems/Atlas/Textures/PluginData/ObjectNrm.dds
                _HeightMap = CosmicSerenity/_Systems/Atlas/Textures/PluginData/ObjectHeight.dds
                _PlanetBumpScale = 1.3
                Keywords
                {
                    
                }
            }
            TerrainMaterialOverride
            {
                _Tiling = 0.001
                _SteepPower = 3
                _SteepContrast = 5
                _LowMidBlendStart = 2000
                _LowMidBlendEnd = 2200
                _MidHighBlendStart = 2300
                _MidHighBlendEnd = 3000
                _SpecularIntensity = 1
                _SpecularPower = 1
                _BumpScale = 1
                _DisplacementScale = 0.5
                _DisplacementOffset = 0
                
            }
        }
    }
    @Body[Plutus]
    {
        // Here is where the usual terrain config goes
        // This patches in the scaled properties
        ParallaxScaledProperties
        {
            // Possible modes:
            // FromTerrain
            // Baked
            // Custom
            // CustomRequiresTerrain

            // Altitude in meters
            minTerrainAltitude = -394
            maxTerrainAltitude = 7985
            mode = FromTerrain
            Material
            {
                _ColorMap = CosmicSerenity/_Systems/Atlas/Textures/PluginData/PlutusClr.dds
                _BumpMap = CosmicSerenity/_Systems/Atlas/Textures/PluginData/PlutusNrm.dds
                _HeightMap = CosmicSerenity/_Systems/Atlas/Textures/PluginData/PlutusHeight.dds
                _PlanetBumpScale = 1.3
                Keywords
                {
                    
                }
            }
            TerrainMaterialOverride
            {
                _Tiling = 0.0017
                _SteepPower = 2
                _SteepContrast = 5
                _LowMidBlendStart = 3000
                _LowMidBlendEnd = 3200
                _MidHighBlendStart = 4300
                _MidHighBlendEnd = 4600
                _SpecularIntensity = 1
                _SpecularPower = 1
                _BumpScale = 1
                _DisplacementScale = 0.5
                _DisplacementOffset = 0
                
            }
        }
    }
}