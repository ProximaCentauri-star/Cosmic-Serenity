//Planet Classification Experiment
@EXPERIMENT_DEFINITION:HAS[#id[RRplanetClass]]:NEEDS[!RationalResourcesAU]
{
	@RESULTS
	{
		AnubisInSpaceHigh = #$@RR_SCIDICT/RR_Class_StarNeutronHigh$
		AnubisInSpaceLow = #$@RR_SCIDICT/RR_Class_StarNeutronLow$
		
		AnkhInSpaceHigh = #$@RR_SCIDICT/RR_Class_SrfRockMetalHigh$
		AnkhInSpaceLow = #$@RR_SCIDICT/RR_Class_SrfRockMetalLow$ $@RR_SCIDICT/RR_Class_ExoRock$
		NeithInSpaceHigh = #$@RR_SCIDICT/RR_Class_SrfRockMetalHigh$
		NeithInSpaceLow = #$@RR_SCIDICT/RR_Class_SrfRockMetalLow$ $@RR_SCIDICT/RR_Class_ExoRock$
		SobekInSpaceHigh = #$@RR_SCIDICT/RR_Class_SrfRockHigh$
		SobekInSpaceLow = #$@RR_SCIDICT/RR_Class_SrfRockLow$  $@RR_SCIDICT/RR_Class_AtmOxygen$  $@RR_SCIDICT/RR_Class_ExoRock$
		RaInSpaceHigh = #$@RR_SCIDICT/RR_Class_SrfRockMetalHigh$
		RakhInSpaceLow = #$@RR_SCIDICT/RR_Class_SrfRockMetalLow$ $@RR_SCIDICT/RR_Class_ExoRock$
	}
}
		
//Graviolium Experiment
@EXPERIMENT_DEFINITION:HAS[#id[RRgravioliPing]]
{
	@RESULTS
	{
		AnubisInSpaceLow = #$@RR_SCIDICT/RR_GravPing_StarNeutronLow$
		AnubisInSpaceHigh = #$@RR_SCIDICT/RR_GravPing_StarNeutronHigh$
		AnkhInSpace = #$@RR_SCIDICT/RR_GravPing_PlanetLight$
		SobekInSpace = #$@RR_SCIDICT/RR_GravPing_PlanetLight$
		NeithInSpace = #$@RR_SCIDICT/RR_GravPing_PlanetLight$
		RaInSpace = #$@RR_SCIDICT/RR_GravPing_PlanetLight$
	}
}