@EXPERIMENT_DEFINITION:HAS[#id[temperatureScan]]
{
    @RESULTS
    {
		AnubisInSpaceHigh = Exposing the temperature probe to the pulsar results in high temperature. Shading it results in low temperature. Science!
		AnubisInSpaceLow = Exposing the temperature probe to the pulsar results in high temperature. Shading it results in low temperature. Science! How about landing on Anubis to see what happens.
		AnubisSrfLanded = The temperature instrument explodes from the heat that is the result of everything being compressed. But manages to recommend that you remove your helmet.
		
		AnkhInSpaceHigh = Exposing the temperature probe to the pulsar results in high temperature. Shading it results in low temperature. Science!
		AnkhInSpaceLow = Exposing the temperature probe to the pulsar results in high temperature. Shading it results in low temperature. Science!
		AnkhSrfLanded = Exposing the temperature probe to the pulsar results in high temperature. Shading it results in low temperature. Huh! Science! Yeah yeah. The temperature instrument is bored with this same old stuff. It suggests removing your helmet to see if there is a difference.
		
		NeithInSpaceHigh = Exposing the temperature probe to the pulsar results in high temperature. Shading it results in low temperature. Science!
		NeithInSpaceLow = Exposing the temperature probe to the pulsar results in high temperature. Shading it results in low temperature. Science!
		NeithSrfLanded = Exposing the temperature probe to the pulsar results in high temperature. Shading it results in low temperature. Science!
		
		SobekInSpaceHigh = Exposing the temperature probe to the pulsar results in high temperature. Shading it results in low temperature. Science!
		SobekInSpaceLow = Exposing the temperature probe to the pulsar results in high temperature. Shading it results in low temperature. Science!
		SobekSrfLanded = Temperatures were had.
		SobekSrfSplashed = There continue to be temperatures. Perhaps if you removed your helmet and suit and jumped in the liquid there would be other results. Ignore the pulsar. All is well.
		SobekFlyingHigh = There were temperatures.
		SobekFlyingLow = Temperatures were not temperate.
		
		RaInSpaceHigh = Exposing the temperature probe to the pulsar results in high temperature. Shading it results in low temperature. Science!
		RaInSpaceLow = Exposing the temperature probe to the pulsar results in high temperature. Shading it results in low temperature. Science!
		RaSrfLanded = Exposing the temperature probe to the pulsar results in high temperature. Shading it results in low temperature. Science! Remove your helmet to see if that changes anything.
	}
}

@EXPERIMENT_DEFINITION:HAS[#id[barometerScan]]
{
    @RESULTS
    {
		AnubisInSpaceHigh = Huh! Vacuum.  Who would have thought.
		AnubisInSpaceLow = Yep!  Still a vacuum.  Maybe if you land on Anubis.....
		AnubisSrfLanded = Readings are off the scale given that this is a pulsar with crazy high gravity. Before collapsing into itself, the barometer refers you to the temperature instrument.
		
		AnkhInSpaceHigh = Huh! Vacuum.  In space. Who would have thought.
		AnkhInSpaceLow = Yep!  Still a vacuum. Almost like an absence of atmosphere. In Space. Man......
		AnkhSrfLanded = Yeah. Like a vacuum planet will have anything but a vacuum.
		
		NeithInSpaceHigh = Huh! Vacuum.  Who would have thought.
		NeithInSpaceLow = Yep!  Still a vacuum. Expect anything different? The barometer suggests removing your helmet as a control.
		NeithSrfLanded = Yeah. Like a vacuum planet will have anything but a vacuum. Just take off your helmet to be sure.
		
		SobekInSpaceHigh = Huh! Vacuum.  Who would have thought.
		SobekInSpaceLow = Yep!  Still a vacuum.
		SobekSrfLanded = Nope! Not a vacuum. The barometer recommends removal of your helmet while on EVA.
		SobekSrfSplashed = Still not a vacuum while splashed down in this liquidy stuff. Obey the temperature instrument.
		SobekFlyingHigh = Kinda vacuum-ish but not really so much. Almost like there is atmosphere. Go outside and remove your helmet.
		SobekFlyingLow = Even less like a vacuum. Definitely go outside and remove your helmet.
		
		RaInSpaceHigh = It feels like the barometer is giving you the side eye and saying.. Wow! Vacuum. In space. Who would have thought.
		RaInSpaceLow = Yep!  Still a vacuum.
		RaSrfLanded = Yeah. Like a vacuum planet will have anything but a vacuum. The barometer gives an exasperated vibe. Obey the temperature instrument.
 
	}
}

